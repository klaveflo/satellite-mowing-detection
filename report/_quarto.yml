  subtitle: "Improving Automated Mowing Detection Using Multimodal Remote Sensing and Machine Learning"
  author:
    - Florian Klaver
  date: "2026-07-02"
  downloads: pdf           # adds a PDF download button to the HTML navbar
  chapters:
